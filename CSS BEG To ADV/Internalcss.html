<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: blue;
            text-align: center;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: grey;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <p>This is a sample paragraph demonstrating internal CSS styling. Internal CSS allows you to define styles within the <style> tag in the head section of the HTML document.</p>
</body>
</html>
